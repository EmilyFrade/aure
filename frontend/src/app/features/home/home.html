<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="w-full max-w-md text-center">
    <h1 class="text-3xl font-bold text-gray-900">Aure</h1>
    <p class="text-gray-500 mt-2">Agendamento online para marcas e profissionais.</p>

    <div class="bg-white rounded-lg shadow p-6 mt-8 text-left">
      <h2 class="font-medium text-gray-800">Tenho um link de agendamento</h2>
      <div class="mt-3 flex gap-2">
        <input
          type="text"
          placeholder="ex: barbearia-do-zeca"
          [ngModel]="slug()"
          (ngModelChange)="slug.set($event)"
          (keyup.enter)="goToBooking()"
          class="flex-1 rounded-md border border-gray-300 px-3 py-2 text-sm"
        />
        <button
          type="button"
          (click)="goToBooking()"
          class="rounded-md bg-indigo-600 text-white px-4 py-2 text-sm font-medium"
        >
          Ir
        </button>
      </div>
    </div>

    <a routerLink="/profissional/login" class="block mt-6 text-sm text-indigo-600">Sou profissional, quero acessar minha agenda</a>
  </div>
</div>
