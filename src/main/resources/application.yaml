spring:
  application:
    name: Aure
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  datasource:
    url: jdbc:postgresql://localhost:5432/aure
    username: aure
    password: aure
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

aure:
  api-url: ${API_URL:http://localhost:8080}

whatsapp:
  provider: ${WHATSAPP_PROVIDER:stub}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  allowed-numbers: ${WHATSAPP_ALLOWED_NUMBERS:}
  evolution:
    url: ${EVOLUTION_URL:http://localhost:8085}
    api-key: ${EVOLUTION_API_KEY:aure-evolution-local}
    instance: ${EVOLUTION_INSTANCE:aure}

reminder:
  interval: ${REMINDER_INTERVAL:PT5M}
