<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-lg shadow p-6">
    <h1 class="text-xl font-bold text-gray-900 text-center">Entrar como profissional</h1>

    @if (errorMessage()) {
      <div class="mt-4 rounded-md bg-red-50 border border-red-200 text-red-700 px-4 py-2 text-sm">
        {{ errorMessage() }}
      </div>
    }

    <label class="block mt-6 text-sm font-medium text-gray-700">E-mail</label>
    <input
      type="email"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2"
    />

    <label class="block mt-4 text-sm font-medium text-gray-700">Senha</label>
    <input
      type="password"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      (keyup.enter)="submit()"
      class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2"
    />

    <button
      type="button"
      [disabled]="submitting()"
      (click)="submit()"
      class="mt-6 w-full rounded-md bg-indigo-600 text-white py-2 font-medium disabled:opacity-50"
    >
      {{ submitting() ? 'Entrando...' : 'Entrar' }}
    </button>
  </div>
</div>
