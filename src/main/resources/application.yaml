spring:
  application:
    name: Aure
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/aure}
    username: ${DATABASE_USERNAME:aure}
    password: ${DATABASE_PASSWORD:aure}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

aure:
  api-url: ${API_URL:http://localhost:8080}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

whatsapp:
  provider: ${WHATSAPP_PROVIDER:stub}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  allowed-numbers: ${WHATSAPP_ALLOWED_NUMBERS:}
  evolution:
    url: ${EVOLUTION_URL:http://localhost:8085}
    api-key: ${EVOLUTION_API_KEY:aure-evolution-local}
    instance: ${EVOLUTION_INSTANCE:aure}
    keep-alive-interval: ${EVOLUTION_KEEP_ALIVE_INTERVAL:PT10M}

reminder:
  interval: ${REMINDER_INTERVAL:PT5M}
